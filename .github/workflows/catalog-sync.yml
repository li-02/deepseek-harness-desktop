name: Sync desktop plugin catalog

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run catalog:sync
      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- plugin-catalog.json; then
            echo 'Catalog is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin-catalog.json
          git commit -m 'chore(catalog): 同步桌面端插件目录' -m '更新安装包回退快照和在线目录，让已安装的 Desktop 能读取最新插件列表。'
          git push
